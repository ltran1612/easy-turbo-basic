# Translator findings
"tr.warn.text_after_ctrl_z" = "“{file}” còn chữ nằm sau dấu kết thúc tệp (Ctrl-Z). Turbo Basic trước đây cũng không đọc phần đó, nên nó không thuộc chương trình. Nếu cần phần đó, hãy mở tệp bằng Notepad và chuyển nó lên trên dấu kết thúc."

"build.translating" = "Đang đọc và chuyển đổi chương trình…"
"diag.at_line_only" = "dòng {line}"
"diag.ours" = "Đây là lỗi của Easy Turbo Basic, không phải lỗi trong chương trình của bạn. Hãy sao chép phần chi tiết kỹ thuật và gửi cho người đã đưa bạn ứng dụng này."
"src.reject.gw_tokenized" = "Đây là chương trình GW-BASIC được lưu ở dạng nhị phân thu gọn của GW-BASIC. Hãy mở nó bằng GW-BASIC hoặc PC-BASIC, gõ SAVE \"TEN\",A để lưu thành văn bản, rồi thêm tệp mới đó vào đây."
"src.reject.gw_protected" = "Chương trình GW-BASIC này được lưu ở chế độ bảo vệ (có ,P) nên không đọc được dưới dạng văn bản. PC-BASIC mở được nó: hãy lưu lại với ,A rồi thêm tệp mới đó vào đây."
"src.reject.qb_binary" = "Đây là chương trình QuickBASIC được lưu ở dạng nhị phân riêng của QuickBASIC. Hãy mở nó bằng QuickBASIC, lưu thành văn bản, rồi thêm tệp đó vào đây."
"tr.refuse.call_interrupt" = "Dòng này gọi trực tiếp một dịch vụ của DOS hoặc BIOS (CALL INTERRUPT). Windows không có các dịch vụ của DOS, nên phần này của chương trình phải được viết lại bằng các lệnh BASIC thông thường."
"tr.refuse.call_absolute" = "Dòng này chạy trực tiếp mã máy (CALL ABSOLUTE). Mã máy viết cho DOS không chạy được trên Windows ngày nay, nên phần này phải được viết lại bằng BASIC."
"tr.refuse.inline" = "Phần này được viết bằng hợp ngữ cho DOS (INLINE). Nó không chạy được trên Windows ngày nay và phải được viết lại bằng BASIC."
"tr.refuse.mbf" = "Dòng này chuyển đổi số sang hoặc từ định dạng mà Microsoft BASIC dùng trong tệp truy cập ngẫu nhiên (MKMS$, MKMD$, CVMS, CVMD). Trình biên dịch bên dưới ứng dụng này không đọc được định dạng đó, và một con số đọc sai sẽ cho kết quả sai chứ không báo lỗi, nên việc biên dịch được dừng lại."
"tr.refuse.reg" = "Dòng này đọc hoặc đặt thanh ghi của bộ xử lý (REG), vốn chỉ có ý nghĩa khi đi cùng CALL INTERRUPT hoặc mã hợp ngữ cho DOS. Phần này phải được viết lại bằng BASIC."
"tr.refuse.endmem" = "Dòng này hỏi vùng nhớ của DOS kết thúc ở đâu (ENDMEM). Câu trả lời không còn ý nghĩa trên Windows, nên phần này phải được viết lại."
"tr.refuse.eradr" = "Dòng này hỏi địa chỉ bộ nhớ nơi xảy ra lỗi (ERADR), vốn chỉ có ý nghĩa trong chương trình DOS. Có thể dùng ERL (số dòng xảy ra lỗi) thay thế."
"tr.refuse.jump_into_def" = "Có lệnh nhảy tới số dòng này, nhưng đây là dòng đầu của một định nghĩa hàm (DEF FN). Turbo Basic không cho phép nhảy vào trong một định nghĩa, nên không thể chuyển đổi."
"tr.refuse.def_without_end" = "Định nghĩa hàm này (DEF FN) không có END DEF đi sau."
"tr.refuse.exit_if_outside_block" = "EXIT IF chỉ được dùng bên trong một khối IF (IF … THEN có END IF), nhưng lệnh này không nằm trong khối nào như vậy."
"tr.note.meta_ignored" = "{meta} dùng để thiết lập bộ nhớ hoặc thiết bị cho DOS. Trên Windows không cần đến, nên đã được bỏ qua."
"tr.note.memset_ignored" = "MEMSET dùng để chia bộ nhớ cho DOS. Trên Windows không cần đến, nên đã được bỏ qua."
"tr.refuse.jump_into_sub" = "Có lệnh nhảy tới số dòng này, nhưng đây là dòng đầu của một thủ tục (SUB). Turbo Basic không cho phép nhảy vào trong thủ tục, nên không thể chuyển đổi."
"tr.refuse.sub_without_end" = "Thủ tục này (SUB) không có END SUB đi sau."
"tr.refuse.include_missing" = "Dòng này đưa vào tệp “{name}”, nhưng không tìm thấy tệp đó. Đã tìm ở: {searched}. Hãy thêm tệp đó vào danh sách của chương trình, hoặc đặt nó cùng thư mục với chương trình."
"tr.refuse.include_not_text" = "Dòng này đưa vào tệp “{name}”, nhưng tệp đó không phải chương trình BASIC: {what}"
"tr.refuse.include_cycle" = "Dòng này đưa vào tệp “{name}”, nhưng tệp đó đang được đưa vào rồi — các tệp đưa nhau vào thành một vòng tròn."
"tr.refuse.if_unknown_const" = "Lệnh $IF này kiểm tra một hằng số có tên chưa được định nghĩa ở phía trên."
"tr.refuse.if_unbalanced" = "Các dòng $IF, $ELSE và $ENDIF không khớp nhau: thiếu hoặc thừa một dòng."
