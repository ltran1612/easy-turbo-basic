# Translator findings
"tr.warn.text_after_ctrl_z" = "“{file}” has more text after the end-of-file mark (Ctrl-Z). Turbo Basic never read it either, so it is not part of the program. If it should be, open the file in Notepad and move it above the mark."

"build.translating" = "Reading and translating your program…"
"diag.at_line_only" = "line {line}"
"diag.ours" = "This is a problem in Easy Turbo Basic, not in your program. Please copy the technical details and send them to whoever gave you this application."
"src.reject.gw_tokenized" = "This is a GW-BASIC program saved in GW-BASIC's compact binary form. Open it in GW-BASIC or PC-BASIC, type SAVE \"NAME\",A to save it as text, and add the new file instead."
"src.reject.gw_protected" = "This GW-BASIC program was saved protected (with ,P), so it cannot be read as text. PC-BASIC can open it: save it again with ,A and add the new file instead."
"src.reject.qb_binary" = "This is a QuickBASIC program saved in QuickBASIC's own binary form. Open it in QuickBASIC, save it as text, and add that file instead."
"tr.refuse.call_interrupt" = "This line calls a DOS or BIOS service directly (CALL INTERRUPT). Windows has no DOS services, so this part of the program has to be rewritten with ordinary BASIC statements."
"tr.refuse.call_absolute" = "This line runs machine code directly (CALL ABSOLUTE). Machine code written for DOS cannot run on today's Windows, so this part has to be rewritten in BASIC."
"tr.refuse.inline" = "This part is written in assembly language for DOS (INLINE). It cannot run on today's Windows and has to be rewritten in BASIC."
"tr.refuse.mbf" = "This line converts numbers to or from the format Microsoft BASIC used inside random-access files (MKMS$, MKMD$, CVMS, CVMD). The compiler behind this application cannot read that format, and a number read the wrong way would be a wrong answer rather than an error, so the build is stopped instead."
"tr.refuse.reg" = "This line reads or sets processor registers (REG), which only mean something together with CALL INTERRUPT or assembly code for DOS. This part has to be rewritten in BASIC."
"tr.refuse.endmem" = "This line asks where DOS memory ends (ENDMEM). The answer has no meaning on Windows, so this part has to be rewritten."
"tr.refuse.eradr" = "This line asks for the memory address where an error happened (ERADR), which only meant something inside a DOS program. ERL, the line number of the error, can be used instead."
"tr.refuse.jump_into_def" = "Something jumps to this line number, but it is the first line of a function definition (DEF FN). Turbo Basic does not allow jumping into a definition, so this cannot be translated."
"tr.refuse.def_without_end" = "This function definition (DEF FN) has no END DEF after it."
"tr.refuse.exit_if_outside_block" = "EXIT IF is only allowed inside an IF block (IF … THEN with END IF), and this one is not inside one."
"tr.note.meta_ignored" = "{meta} set up memory or devices for DOS. It is not needed on Windows and has been left out."
"tr.note.memset_ignored" = "MEMSET divided up memory for DOS. It is not needed on Windows and has been left out."
"tr.refuse.jump_into_sub" = "Something jumps to this line number, but it is the first line of a procedure (SUB). Turbo Basic does not allow jumping into a procedure, so this cannot be translated."
"tr.refuse.sub_without_end" = "This procedure (SUB) has no END SUB after it."
"tr.refuse.include_missing" = "This line includes “{name}”, which could not be found. Looked in: {searched}. Add that file to the program's list, or put it in the same folder as the program."
"tr.refuse.include_not_text" = "This line includes “{name}”, but that file is not a BASIC program: {what}"
"tr.refuse.include_cycle" = "This line includes “{name}”, which is already being included — the files include each other in a circle."
"tr.refuse.if_unknown_const" = "This $IF tests a named constant that has not been defined above it."
"tr.refuse.if_unbalanced" = "The $IF, $ELSE and $ENDIF lines do not match up: one is missing or extra."
