[package]
name = "etb-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Easy Turbo Basic — the application window."

[[bin]]
name = "easy-turbo-basic"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
etb-core.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.36.2"
rfd = "0.15"
crossbeam-channel.workspace = true
sys-locale.workspace = true
opener.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fontdb = "0.24.0"
ttf-parser = "0.25"

[dev-dependencies]
ttf-parser = "0.25"
etb-core.workspace = true

# Embeds the icon as a Windows resource, so easy-turbo-basic.exe carries it in
# Explorer and on the taskbar. See build.rs, which decides by the *target*.
#
# Not under `[target.'cfg(windows)'.build-dependencies]`, which is where this
# started: a build dependency's `cfg` is matched against the host, so on a Linux
# host the crate was absent and a Windows executable came out with no icon at
# all. It is a build dependency of a few hundred kilobytes and it compiles
# anywhere; build.rs returns early when the target is not Windows.
[build-dependencies]
winresource = "0.1"

